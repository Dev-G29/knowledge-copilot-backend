spring:
  application:
    name: knowledge-copilot
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    async:
      # Streaming answers keep the request open while Gemini generates tokens.
      request-timeout: 180s
  ai:
    model:
      chat: ${SPRING_AI_CHAT_PROVIDER:google-genai}
      embedding:
        text: ${SPRING_AI_EMBEDDING_PROVIDER:google-genai}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}
            # Gemini 3.x "thinks" before answering. RAG answers are short lookups, so a low level
            # cuts time-to-first-token a lot. MINIMAL | LOW | MEDIUM | HIGH
            thinking-level: ${GEMINI_THINKING_LEVEL:LOW}
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
              task-type: RETRIEVAL_DOCUMENT
              dimensions: 3072
              auto-truncate: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knowledgeCopilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    # Lets Flyway adopt a database that was originally created by Hibernate's ddl-auto
    # (the old Render database): V1 is treated as already applied and V2+ run on top.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

server:
  port: 8080
  # The app runs behind Caddy in production, so trust X-Forwarded-* headers for client IP and scheme.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

application:
  security:
    jwt:
      # Local development fallback only. The prod profile requires JWT_SECRET to be set.
      secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef0123456789}
      access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    # Comma-separated list. Wildcards are allowed, e.g. https://knowledge-copilot-*.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@example.com}
    # No admin is seeded unless a password is provided.
    password: ${ADMIN_PASSWORD:}
    # When true, an existing admin account gets its password reset to ADMIN_PASSWORD on startup.
    sync-password: ${ADMIN_SYNC_PASSWORD:false}
  rate-limit:
    chat-requests-per-minute: ${RATE_LIMIT_CHAT_PER_MINUTE:20}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
  rag:
    min-relevance-score: ${RAG_MIN_RELEVANCE_SCORE:0.25}
    first-token-timeout-seconds: ${RAG_FIRST_TOKEN_TIMEOUT_SECONDS:45}
