spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
  jpa:
    properties:
      hibernate:
        format_sql: false

application:
  security:
    jwt:
      # No fallback: startup fails if JWT_SECRET is missing.
      secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
